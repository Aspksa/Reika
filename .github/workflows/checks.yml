name: Reika checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  frontend:
    name: Node.js / CSS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare reproducible build and version inventory
        run: npm run build
      - run: npm run check
      - run: npm run test:versions
      - run: npm run test:release
      - name: Проверить русские описания изменений
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run release:check -- --base "$RELEASE_BASE"
      - run: npm run check:build

  checks:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Parse Windows PowerShell 5.1 scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/validate_windows.ps1
      - name: Validate Project Chronicle events
        run: python scripts/chronicle.py validate
      - name: Test HTTP security, lifecycle and Windows launcher
        run: python -X utf8 -B -m unittest discover -s tests -v
      - name: Проверить автономный ZIP со встроенным Python
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "import json; print(json.load(open('versions.json', encoding='utf-8'))['project'])"
          $archive = Join-Path $env:RUNNER_TEMP "Reika-$version.zip"
          python scripts/package_release.py --ref HEAD --version $version --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/verify_portable_release.py $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  browser:
    name: Browser interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test tooling
        run: |
          npm ci --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/reika-browser" playwright@1.56.1
          "$RUNNER_TEMP/reika-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build candidate interface for browser tests
        run: npm run build
      - name: Check browser interface
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/reika-browser/node_modules/playwright
        run: node tests/browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reika-interface
          path: test-results/
          if-no-files-found: ignore
